# Super admin (administrate) Chinese translations.
# The administrate gem ships its own zh-CN scaffolding translations (buttons,
# pagination, forms); this file adds the model/attribute names it can't know.
# Locale is zh-CN (hyphen) to match administrate; the main app uses zh_CN.
zh-CN:
  activerecord:
    models:
      account:
        one: 账户
        other: 账户
      user:
        one: 用户
        other: 用户
      account_user:
        one: 账户成员
        other: 账户成员
      agent_bot:
        one: 客服机器人
        other: 客服机器人
      access_token:
        one: 访问令牌
        other: 访问令牌
      installation_config:
        one: 安装配置
        other: 安装配置
      platform_app:
        one: 平台应用
        other: 平台应用
      platform_banner:
        one: 平台公告
        other: 平台公告
    attributes:
      account:
        id: ID
        name: 名称
        locale: 语言
        status: 状态
