        description: 锁定的 Shopify 应用定价套餐目录，包含套餐标识、功能和固定限额
      CAPTAIN_TOPUP_OPTIONS:
        title: Captain 充值选项
        description: 按货币划分的 AI 点数充值套餐，例如 {"usd":[{"credits":1000,"amount":20.0}],"brl":[{"credits":1000,"amount":100.0}]}
      ENABLE_MULTI_CURRENCY_BILLING:
        title: 启用多币种计费
        description: 以当地货币（例如 BRL）向新账户计费，并显示按币种计价的点数充值；关闭时所有账户均以美元计费
      MARKETING_CONVERSION_TRACKING_CONFIG:
        title: 营销转化跟踪配置
        description: 用于跟踪 Chatwoot Cloud 注册和套餐激活转化的 JSON 配置
      DEVICE_VERIFICATION_ENABLED:
        title: 设备验证
        description: 从未识别的设备使用密码登录时，需要输入通过邮件发送的验证码（仅限 Chatwoot Cloud）
      STRIPE_APP_AUTHORIZE_URL:
        title: Stripe 应用授权 URL
        description: 为此安装实例使用 Stripe 应用的 OAuth 链接：正式环境使用 Live 模式，测试使用 Sandbox。链接和密钥必须使用相同的环境。
      STRIPE_APP_SECRET_KEY:
        title: Stripe 应用密钥
        description: Live 模式使用应用开发者的 live 密钥，Sandbox 使用应用托管的 sandbox 密钥。需要启用 Active Record 加密。切换环境后需要重新连接现有账户。
      SLACK_SIGNING_SECRET:
        title: Slack 签名密钥
        description: 用于验证传入 Webhook 签名的 Slack 签名密钥
      ENABLE_SHOPIFY_INTEGRATION:
        title: 启用 Shopify 集成
        description: 启用 Shopify OAuth、账户集成 API、Webhook 和控制台相关界面
      SHOPIFY_APP_STORE_URL:
        title: Shopify 应用商店 URL
        description: Shopify 应用商店的应用页面 URL（例如 https://apps.shopify.com/your-app）
      SHOPIFY_PARTNER_ORGANIZATION_ID:
        title: Shopify 合作伙伴组织 ID
        description: 用于访问 Shopify Partner API 的数字组织 ID
      SHOPIFY_PARTNER_APP_ID:
        title: Shopify 合作伙伴应用 ID
